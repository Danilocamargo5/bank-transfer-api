# Development Profile Configuration

# LocalStack (DynamoDB + SQS)
aws.endpoint.url=http://localhost:4566
aws.dynamodb.endpoint=http://localhost:4566
aws.sqs.endpoint=http://localhost:4566

# Kafka Local
spring.kafka.bootstrap-servers=localhost:9092

# Logging - Debug mode for development
logging.level.root=INFO
logging.level.com.danilo.banktransfer=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.software.amazon.awssdk=DEBUG

# Actuator - expose more endpoints in development
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,heapdump
