spring.application.name=bank-transfer-api

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===== AWS SDK Configuration =====
# DynamoDB Local endpoint for local development
aws.endpoint.url=http://localhost:8000
aws.region=us-east-1
aws.access.key.id=local
aws.secret.access.key=local

# DynamoDB Configuration
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.region=us-east-1
aws.dynamodb.table.accounts=accounts
aws.dynamodb.table.transfers=transfers

# SQS Configuration - DISABLED (use only DynamoDB Local for now)
# aws.sqs.endpoint=http://localhost:4566
# aws.sqs.region=us-east-1
# aws.sqs.queue.transfer-failed=transfer-failed
# aws.sqs.queue.transfer-failed-dlq=transfer-failed-dlq
# aws.sqs.retry.max-attempts=3
# aws.sqs.retry.backoff-delay=5000

# ===== Kafka Configuration =====
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=transfer-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# ===== Kafka Topics =====
app.kafka.topic.transfer-requested=transfer-requested
app.kafka.topic.transfer-completed=transfer-completed
app.kafka.topic.transfer-failed=transfer-failed
app.kafka.consumer.concurrency=1

# ===== Transfer Service Configuration =====
transfer.retry.max-attempts=3
transfer.retry.backoff-delay=1000
transfer.timeout.seconds=30

# ===== Logging =====
logging.level.root=INFO
logging.level.com.danilo.banktransfer=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.web=INFO
logging.level.software.amazon.awssdk=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
