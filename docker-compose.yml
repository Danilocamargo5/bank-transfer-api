services:
  # LocalStack: AWS services emulation (DynamoDB, SQS, API Gateway) - v4.14.0 (last free version)
  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    ports:
      - "4566:4566"      # LocalStack edge endpoint (all services)
    environment:
      SERVICES: dynamodb,sqs,apigateway,s3
      DEBUG: 1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_SHARE_DB: "1"
      DYNAMODB_STREAM_SPEC: "1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/init-localstack.sh:/docker-entrypoint-initaws.d/init-localstack.sh"
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper: Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka: Event streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - ./scripts/init-kafka.sh:/usr/local/bin/init-kafka.sh

  # Kafka Topics Initialization
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        sleep 10
        
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer-requested --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer-completed --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer-failed --partitions 1 --replication-factor 1
        
        echo "Kafka topics created successfully!"
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - bank-transfer-network

  # Sample Data Initialization
  init-sample-data:
    image: amazon/aws-cli:latest
    container_name: init-sample-data
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DynamoDB tables to be created..."
        
        RETRY=0
        while [ $$RETRY -lt 30 ]; do
          if aws dynamodb describe-table --table-name accounts --endpoint-url http://localstack:4566 2>/dev/null | grep -q "TableArn"; then
            echo "✓ Accounts table found!"
            break
          fi
          RETRY=$$(( $$RETRY + 1 ))
          echo "  Retry $$RETRY/30 - Waiting for accounts table..."
          sleep 1
        done
        
        echo ""
        echo "Creating sample test accounts..."
        
        aws dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-001"}, "balance": {"N": "5000.00"}, "currency": {"S": "BRL"}, "status": {"S": "ACTIVE"}, "customerName": {"S": "João Silva"}, "createdAt": {"S": "2026-08-27T21:00:00Z"}, "updatedAt": {"S": "2026-08-27T21:00:00Z"}}' \
          --endpoint-url http://localstack:4566
        echo "✓ Account acc-001 created"
        
        aws dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-002"}, "balance": {"N": "1000.00"}, "currency": {"S": "BRL"}, "status": {"S": "ACTIVE"}, "customerName": {"S": "Maria Santos"}, "createdAt": {"S": "2026-08-27T21:00:00Z"}, "updatedAt": {"S": "2026-08-27T21:00:00Z"}}' \
          --endpoint-url http://localstack:4566
        echo "✓ Account acc-002 created"
        
        aws dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-003"}, "balance": {"N": "3500.00"}, "currency": {"S": "BRL"}, "status": {"S": "ACTIVE"}, "customerName": {"S": "Pedro Costa"}, "createdAt": {"S": "2026-08-27T21:00:00Z"}, "updatedAt": {"S": "2026-08-27T21:00:00Z"}}' \
          --endpoint-url http://localstack:4566
        echo "✓ Account acc-003 created"
        
        aws dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-000"}, "balance": {"N": "0.00"}, "currency": {"S": "BRL"}, "status": {"S": "INACTIVE"}, "customerName": {"S": "Conta Encerrada"}, "createdAt": {"S": "2026-08-27T21:00:00Z"}, "updatedAt": {"S": "2026-08-27T21:00:00Z"}}' \
          --endpoint-url http://localstack:4566
        echo "✓ Account acc-000 (inactive) created"
        
        echo "✅ Sample data initialization complete!"
    networks:
      - bank-transfer-network

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-transfer-api
    ports:
      - "8080:8080"
    depends_on:
      localstack:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-sample-data:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_APPLICATION_NAME: bank-transfer-api
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka UI: Web interface for Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      - kafka
      - zookeeper
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Admin - REMOVED (use AWS CLI or application to manage DynamoDB)
  # dynamodb-admin:
  #   image: aaronshaf/dynamodb-admin:latest
  #   container_name: dynamodb-admin
  #   ports:
  #     - "8001:8001"
  #   depends_on:
  #     localstack:
  #       condition: service_healthy
  #   environment:
  #     DYNAMO_ENDPOINT: http://localstack:4566
  #     AWS_REGION: us-east-1
  #     AWS_ACCESS_KEY_ID: local
  #     AWS_SECRET_ACCESS_KEY: local
  #   networks:
  #     - bank-transfer-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # API Gateway Initialization
  init-api-gateway:
    image: amazon/aws-cli:latest
    container_name: init-api-gateway
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for API Gateway to be ready..."
        sleep 10
        
        echo "Creating API Gateway REST API..."
        API_ID=$$(aws apigateway create-rest-api \
          --name "bank-transfer-api" \
          --description "Bank Transfer API Gateway" \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 \
          --query 'id' \
          --output text)
        
        echo "✓ API created with ID: $$API_ID"
        
        ROOT_ID=$$(aws apigateway get-resources \
          --rest-api-id $$API_ID \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 \
          --query 'items[0].id' \
          --output text)
        
        API_RESOURCE=$$(aws apigateway create-resource \
          --rest-api-id $$API_ID \
          --parent-id $$ROOT_ID \
          --path-part "api" \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 \
          --query 'id' \
          --output text)
        
        V1_RESOURCE=$$(aws apigateway create-resource \
          --rest-api-id $$API_ID \
          --parent-id $$API_RESOURCE \
          --path-part "v1" \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 \
          --query 'id' \
          --output text)
        
        TRANSFERS_RESOURCE=$$(aws apigateway create-resource \
          --rest-api-id $$API_ID \
          --parent-id $$V1_RESOURCE \
          --path-part "transfers" \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 \
          --query 'id' \
          --output text)
        
        aws apigateway put-method \
          --rest-api-id $$API_ID \
          --resource-id $$TRANSFERS_RESOURCE \
          --http-method POST \
          --authorization-type NONE \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 > /dev/null
        
        aws apigateway put-integration \
          --rest-api-id $$API_ID \
          --resource-id $$TRANSFERS_RESOURCE \
          --http-method POST \
          --type HTTP \
          --integration-http-method POST \
          --uri "http://host.docker.internal:8080/api/v1/transfers" \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 > /dev/null
        
        aws apigateway put-method-response \
          --rest-api-id $$API_ID \
          --resource-id $$TRANSFERS_RESOURCE \
          --http-method POST \
          --status-code 200 \
          --response-models '{"application/json":"Empty"}' \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 > /dev/null
        
        aws apigateway put-integration-response \
          --rest-api-id $$API_ID \
          --resource-id $$TRANSFERS_RESOURCE \
          --http-method POST \
          --status-code 200 \
          --response-templates '{"application/json": "$input.json($$)"}' \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 > /dev/null
        
        DEPLOYMENT_ID=$$(aws apigateway create-deployment \
          --rest-api-id $$API_ID \
          --stage-name dev \
          --endpoint-url http://localstack:4566 \
          --region us-east-1 \
          --query 'id' \
          --output text)
        
        echo "✓ Deployment created: $$DEPLOYMENT_ID"
        echo "✅ API Gateway setup complete!"
        echo "API Endpoint: http://localhost:4566/restapis/$$API_ID/dev/api/v1/transfers"
    networks:
      - bank-transfer-network

networks:
  bank-transfer-network:
    driver: bridge
