version: '3.8'

services:
  # LocalStack: AWS services emulation (DynamoDB, SQS, API Gateway) - v4.14.0 (last free version)
  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    ports:
      - "4566:4566"      # LocalStack edge endpoint (all services)
    environment:
      SERVICES: dynamodb,sqs,apigateway
      DEBUG: 1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_SHARE_DB: "1"
      DYNAMODB_STREAM_SPEC: "1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/init-localstack.sh:/docker-entrypoint-initaws.d/init-localstack.sh"
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper: Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "echo", "ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka: Event streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./scripts/init-kafka.sh:/usr/local/bin/init-kafka.sh

  # Kafka Topics Initialization - REMOVED (use Kafka UI to create manually)
  # kafka-init:
  #   image: confluentinc/cp-kafka:7.5.0
  #   container_name: kafka-init
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       echo "Waiting for Kafka to be ready..."
  #       kafka-topics --bootstrap-server kafka:29092 --list
  #       
  #       echo "Creating topics..."
  #       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer-requested --partitions 1 --replication-factor 1
  #       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer-completed --partitions 1 --replication-factor 1
  #       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer-failed --partitions 1 --replication-factor 1
  #       
  #       echo "Topics created successfully!"
  #       kafka-topics --bootstrap-server kafka:29092 --list
  #   networks:
  #     - bank-transfer-network

  # Kafka UI: Web interface for Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      - kafka
      - zookeeper
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - bank-transfer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Admin - REMOVED (use AWS CLI or application to manage DynamoDB)
  # dynamodb-admin:
  #   image: aaronshaf/dynamodb-admin:latest
  #   container_name: dynamodb-admin
